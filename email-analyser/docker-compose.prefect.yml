# Docker Compose overlay for the Prefect scheduler stack.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prefect.yml up
#
# Or, if you only want the scheduler alongside an already-running app:
#   docker compose -f docker-compose.prefect.yml up

services:

  # ── Prefect server (orchestration backend + UI) ──────────────────────────────
  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: >-
        postgresql+asyncpg://prefect:prefect@prefect-db/prefect
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      prefect-db:
        condition: service_healthy

  # ── Prefect metadata database (separate from the app DB) ────────────────────
  prefect-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - prefect-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Prefect worker (runs flow tasks as subprocesses) ─────────────────────────
  # Uses the stock Prefect image. Code is cloned from GitHub by the pull steps
  # defined in prefect.yaml — no custom image needed.
  worker:
    image: prefecthq/prefect:3-latest
    command: >
      bash -c "
        until prefect work-pool ls >/dev/null 2>&1; do sleep 3; done &&
        (prefect work-pool create default-process --type process --overwrite 2>/dev/null || true) &&
        (prefect concurrency-limit create ai-llm 3 2>/dev/null || true) &&
        prefect worker start --pool default-process
      "
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      # Absolute paths — overrides the relative paths in .env
      GMAIL_TOKEN_PATH: /data/gmail_token.json
      GMAIL_CREDENTIALS_PATH: /data/gmail_credentials.json
      ACCOUNTS_PATH: /data/accounts.json
    env_file:
      - .env
    depends_on:
      prefect-server:
        condition: service_healthy
    volumes:
      # Persist OAuth tokens between restarts
      - ../data:/data

volumes:
  prefect-db-data:
