# Docker Compose for the Prefect orchestration backend (server + metadata DB).
#
# The worker runs directly on the host — NOT in Docker — so that the
# Prokura transparent proxy can intercept and rewrite outbound HTTPS requests.
#
# Start the server:
#   docker compose -f docker-compose.prefect.yml up -d
#
# Start the worker (on the host, separately):
#   prefect worker start --pool default-process

services:

  # ── Prefect server (orchestration backend + UI) ──────────────────────────────
  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: >-
        postgresql+asyncpg://prefect:prefect@prefect-db/prefect
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      prefect-db:
        condition: service_healthy

  # ── Prefect metadata database (separate from the app DB) ────────────────────
  prefect-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - prefect-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prefect-db-data:
