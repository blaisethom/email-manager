# Docker Compose for the Prefect orchestration backend (server + metadata DB + worker).
#
# The worker container reaches the Prokura proxy at http://172.21.1.38:8080
# (this dev container's IP on the Docker network). If that IP changes, update
# HTTP_PROXY / HTTPS_PROXY in the prefect-worker service below.
#
# First-time setup (or after Dockerfile.worker changes):
#   docker compose -f docker-compose.prefect.yml up -d --build prefect-worker
#
# Normal start:
#   docker compose -f docker-compose.prefect.yml up -d

services:

  # ── Prefect server (orchestration backend + UI) ──────────────────────────────
  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: >-
        postgresql+asyncpg://prefect:prefect@prefect-db/prefect
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      prefect-db:
        condition: service_healthy

  # ── Prefect metadata database (separate from the app DB) ────────────────────
  prefect-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - prefect-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Prefect worker ──────────────────────────────────────────────────────────
  prefect-worker:
    image: ghcr.io/blaisethom/email-manager-prefect-worker:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Point at the server by service name (stable, no IP needed)
      PREFECT_API_URL: "http://prefect-server:4200/api"
      # Route outbound HTTPS through the Prokura sidecar inside the worker container.
      # The sidecar listens at localhost:8080 and injects GitHub credentials.
      HTTP_PROXY: "http://127.0.0.1:8080"
      HTTPS_PROXY: "http://127.0.0.1:8080"
      NO_PROXY: "localhost,127.0.0.1,prefect-server,prefect-db"
      # Absolute paths to OAuth credential files mounted from the host data directory.
      GMAIL_CREDENTIALS_PATH: /data/gmail_credentials.json
      GMAIL_TOKEN_PATH: /data/gmail_token.json
    volumes:
      # Mount the host data directory so flows can read OAuth tokens and write DB.
      - ../data:/data
    depends_on:
      prefect-server:
        condition: service_healthy

volumes:
  prefect-db-data:
