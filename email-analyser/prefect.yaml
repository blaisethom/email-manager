# Prefect deployment configuration for the email-manager continuous pipeline.
#
# Deploy all flows:
#   cd email-analyser
#   prefect deploy --all
#
# Or deploy a single flow:
#   prefect deploy --name ingest

name: email-manager
prefect-version: "3.0.0"

# No build/push steps — worker clones the repo on each run.
build: null
push: null

pull:
  # Clone from GitHub. Prokura proxy (http://[::1]:8080) does TLS MITM and injects
  # GitHub App credentials automatically — no auth header needed on our side.
  # We clear credential.helper and any stale extraheader so Prokura handles auth cleanly.
  #
  # Each flow run clones to its own /tmp/em-clone-<run-id> directory so concurrent
  # flows (ingest + enrich firing at :00) don't race on the same path.
  #
  # Prefect 3.7.5: helper_command was removed; use shell: true instead.
  # shell: true runs each non-empty line as a separate `sh -c "line"`, so the git
  # clone is on a single line (no \ continuation) and $PREFECT_FLOW_RUN_ID is
  # expanded by the shell from the inherited environment.
  - prefect.deployments.steps.run_shell_script:
      id: clone_step
      stream_output: true
      shell: true
      script: |
        find /tmp -maxdepth 1 -name 'em-clone-*' -mtime +1 -exec rm -rf {} + 2>/dev/null || true
        rm -rf /tmp/em-clone-${PREFECT_FLOW_RUN_ID}
        GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/true git -c credential.helper= -c http.https://github.com/.extraheader= clone --depth 1 --branch main https://github.com/blaisethom/email-manager.git /tmp/em-clone-${PREFECT_FLOW_RUN_ID}
  # Install vendored wheels (vendor/ dir in the repo) to /tmp/em-deps.
  # No internet required — all deps are bundled as .whl files.
  # A flock inside the script serialises concurrent bootstraps from parallel flow runs.
  - prefect.deployments.steps.run_shell_script:
      id: bootstrap_step
      stream_output: true
      shell: true
      script: /opt/prefect/bin/python3 /tmp/em-clone-${PREFECT_FLOW_RUN_ID}/email-analyser/scripts/worker_bootstrap.py

deployments:
  # ── Ingest: pull raw data from all sources ──────────────────────────────────
  - name: ingest
    entrypoint: email_manager.scheduler.flows:ingest_flow
    description: "Pull emails, calendar events, and HubSpot data"
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/prefect/lib/python3.11/site-packages
    schedules:
      - cron: "*/10 * * * *"
        timezone: "UTC"
        active: true

  # ── Enrich: build threads, labels, search index ─────────────────────────────
  - name: enrich
    entrypoint: email_manager.scheduler.flows:enrich_flow
    description: "Extract threads, enrich company data, rebuild search index"
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/prefect/lib/python3.11/site-packages
    schedules:
      - cron: "*/30 * * * *"
        timezone: "UTC"
        active: true

  # ── AI analysis: interpret dirty companies ───────────────────────────────────
  - name: ai-analysis
    entrypoint: email_manager.scheduler.flows:ai_flow
    description: "Run AI pipeline stages for companies with new data"
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/prefect/lib/python3.11/site-packages
    schedules:
      - cron: "5 * * * *"   # :05 past every hour, offset from enrich
        timezone: "UTC"
        active: true

  # ── Single company: on-demand targeted AI run ────────────────────────────────
  - name: company-ai
    entrypoint: email_manager.scheduler.flows:company_flow
    description: "Run AI pipeline stages for a single company (triggered from the web UI)"
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/prefect/lib/python3.11/site-packages
    schedules: []   # No schedule — triggered on demand
    parameters:
      domain: ""
      stages: null

  # ── Full run: one-shot bootstrap / manual refresh ───────────────────────────
  - name: full-run
    entrypoint: email_manager.scheduler.flows:full_run_flow
    description: "Ingest → Enrich → AI in sequence (manual trigger only)"
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/prefect/lib/python3.11/site-packages
    schedules: []   # No schedule — trigger manually
