# Prefect deployment configuration for the email-manager continuous pipeline.
#
# Deploy all flows:
#   cd email-analyser
#   prefect deploy --all
#
# Or deploy a single flow:
#   prefect deploy --name ingest

name: email-manager
prefect-version: "3.0.0"

# No build/push steps — worker clones the repo on each run.
build: null
push: null

pull:
  # Local worker: code is already present at /app (the Docker container working dir).
  # No clone or vendored-wheel bootstrap needed — the image has all dependencies.
  - prefect.deployments.steps.run_shell_script:
      id: verify_step
      stream_output: false
      shell: true
      script: "test -f /app/src/email_manager/__init__.py && echo 'local source ok'"

deployments:
  # ── Ingest: pull raw data from all sources ──────────────────────────────────
  - name: ingest
    entrypoint: email_manager.scheduler.flows:ingest_flow
    description: "Pull emails, calendar events, and HubSpot data"
    work_pool:
      name: default-process
      job_variables:
        working_dir: /app
        env:
          PYTHONPATH: /app/src
    schedules:
      - cron: "*/10 * * * *"
        timezone: "UTC"
        active: true

  # ── Enrich: build threads, labels, search index ─────────────────────────────
  - name: enrich
    entrypoint: email_manager.scheduler.flows:enrich_flow
    description: "Extract threads, enrich company data, rebuild search index"
    work_pool:
      name: default-process
      job_variables:
        working_dir: /app
        env:
          PYTHONPATH: /app/src
    schedules:
      - cron: "*/30 * * * *"
        timezone: "UTC"
        active: true

  # ── AI analysis: interpret dirty companies ───────────────────────────────────
  - name: ai-analysis
    entrypoint: email_manager.scheduler.flows:ai_flow
    description: "Run AI pipeline stages for companies with new data"
    work_pool:
      name: default-process
      job_variables:
        working_dir: /app
        env:
          PYTHONPATH: /app/src
    schedules:
      - cron: "5 * * * *"   # :05 past every hour, offset from enrich
        timezone: "UTC"
        active: true

  # ── Single company: on-demand targeted AI run ────────────────────────────────
  - name: company-ai
    entrypoint: email_manager.scheduler.flows:company_flow
    description: "Run AI pipeline stages for a single company (triggered from the web UI)"
    work_pool:
      name: default-process
      job_variables:
        working_dir: /app
        env:
          PYTHONPATH: /app/src
    schedules: []   # No schedule — triggered on demand
    parameters:
      domain: ""
      stages: null

  # ── Full run: one-shot bootstrap / manual refresh ───────────────────────────
  - name: full-run
    entrypoint: email_manager.scheduler.flows:full_run_flow
    description: "Ingest → Enrich → AI in sequence (manual trigger only)"
    work_pool:
      name: default-process
      job_variables:
        working_dir: /app
        env:
          PYTHONPATH: /app/src
    schedules: []   # No schedule — trigger manually
