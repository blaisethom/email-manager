# Prefect deployment configuration for the email-manager continuous pipeline.
#
# Deploy all flows:
#   cd email-analyser
#   prefect deploy --all
#
# Or deploy a single flow:
#   prefect deploy --name ingest

name: email-manager
prefect-version: "3.0.0"

# No build/push steps — worker clones the repo on each run.
build: null
push: null

pull:
  # Worker copies code from the local workspace or falls back to GitHub clone.
  # When running on the development machine, use local code directly (faster, no proxy needed).
  # On remote workers (Docker), clone via Prokura sidecar proxy on the dev container.
  #
  # Remote path: deps are pre-installed in the Docker image at /opt/em-deps (see Dockerfile.worker),
  # so only the email_manager source needs to be cloned — no pip install at runtime.
  #
  # NOTE: run_shell_script executes each line as a separate subprocess, so the
  # entire if/else/fi must be on a single line to share shell state.
  - prefect.deployments.steps.run_shell_script:
      id: clone_and_bootstrap
      stream_output: true
      shell: true
      script: |
        mkdir -p /tmp/codex-home && printf '%s' '{"OPENAI_API_KEY":null,"last_refresh":"2026-07-16T00:00:00Z","tokens":{"access_token":"CHATGPT_CODEX_TOKEN","account_id":"CHATGPT_ACCOUNT_ID","id_token":"eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJlbWFpbCI6ImFnZW50QHByb2t1cmEuZGV2IiwiZXhwIjoyMDk5NTY5OTE2LCJodHRwczovL2FwaS5vcGVuYWkuY29tL2F1dGgiOnsiY2hhdGdwdF9hY2NvdW50X2lkIjoiQ0hBVEdQVF9BQ0NPVU5UX0lEIiwiY2hhdGdwdF9wbGFuX3R5cGUiOiJwcm8ifSwiaWF0IjoxNzg0MjA5OTE2fQ.proxy-placeholder","refresh_token":"none"}}' > /tmp/codex-home/auth.json
        LOCAL_SRC=/home/node/workspace/email-manager/email-analyser; LOCAL_VENV=$LOCAL_SRC/.venv; mkdir -p /tmp/em-deps; if [ -d "$LOCAL_SRC/src/email_manager" ] && [ -d "$LOCAL_VENV" ]; then cp -r "$LOCAL_SRC/src/email_manager" /tmp/em-deps/; rm -rf /tmp/em-venv; ln -s "$LOCAL_VENV" /tmp/em-venv; cp -f "$LOCAL_SRC/exclude-cos.txt" /tmp/exclude-cos.txt 2>/dev/null; echo "Using local workspace; /tmp/em-venv -> $LOCAL_VENV"; else CLONE_DIR=$(mktemp -d /tmp/em-XXXXXX); git clone --depth=1 https://github.com/blaisethom/email-manager.git "$CLONE_DIR" || exit 1; cp -r "$CLONE_DIR/email-analyser/src/email_manager" /tmp/em-deps/; cp -f "$CLONE_DIR/email-analyser/exclude-cos.txt" /tmp/exclude-cos.txt 2>/dev/null || true; rm -rf "$CLONE_DIR"; fi

deployments:
  # ── Ingest: pull raw data from all sources ──────────────────────────────────
  - name: ingest
    entrypoint: email_manager.scheduler.flows:ingest_flow
    description: "Pull emails, calendar events, and HubSpot data"
    concurrency_limit: 1
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules:
      - cron: "*/20 * * * *"
        timezone: "UTC"
        active: false

  # ── Enrich: build threads, labels, search index ─────────────────────────────
  - name: enrich
    entrypoint: email_manager.scheduler.flows:enrich_flow
    description: "Extract threads, enrich company data, rebuild search index"
    concurrency_limit: 1
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules:
      - cron: "*/30 * * * *"
        timezone: "UTC"
        active: false

  # ── Label: AI company labelling + search index rebuild ──────────────────────
  - name: label
    entrypoint: email_manager.scheduler.flows:label_flow
    description: "AI company labelling and search index rebuild (runs after enrich)"
    concurrency_limit: 1
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules:
      - cron: "15,45 * * * *"   # :15 and :45, offset 15 min after enrich (:00 and :30)
        timezone: "UTC"
        active: false
    parameters:
      batch_size: 10
      random_sample: true

  # ── Refresh outreach scores: slow SQL, run infrequently ─────────────────────
  - name: refresh-outreach-scores
    entrypoint: email_manager.scheduler.flows:refresh_outreach_scores_flow
    description: "Recompute outreach scores for search ranking (slow SQL; runs every 6 h)"
    concurrency_limit: 1
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules:
      - cron: "0 */6 * * *"
        timezone: "UTC"
        active: false

  # ── AI stage flows: one deployment per pipeline stage ───────────────────────
  #
  # Each stage runs independently on its own schedule. Eligibility is keyed on
  # processing_runs: a company enters a stage's batch when its prerequisite has
  # a more recent successful run. The memory-heavy concurrency slot (limit=1)
  # ensures stages never overlap with each other or with enrich_flow.
  #
  # Schedule offsets:
  #   extract_events     */20 * * * *    :00, :20, :40
  #   discover           3,23,43         :03, :23, :43
  #   analyse            7,27,47         :07, :27, :47
  #   propose            12,32,52        :12, :32, :52
  #   contact_memory     17 */2 * * *    every 2 h

  - name: ai-extract-events
    entrypoint: email_manager.scheduler.flows:extract_events_flow
    description: "Extract events from threads for companies with new email data"
    concurrency_limit: 1
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules:
      - cron: "*/20 * * * *"
        timezone: "UTC"
        active: false
    parameters:
      token_budget: 150000
      label_filter:
        - investor
        - cro
        - pharma
        - clinic

  - name: ai-discover-discussions
    entrypoint: email_manager.scheduler.flows:discover_discussions_flow
    description: "Discover discussions for companies where extract_events completed more recently"
    concurrency_limit: 1
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules:
      - cron: "3,23,43 * * * *"
        timezone: "UTC"
        active: false
    parameters:
      token_budget: 150000
      label_filter:
        - investor
        - cro
        - pharma
        - clinic

  - name: ai-analyse-discussions
    entrypoint: email_manager.scheduler.flows:analyse_discussions_flow
    description: "Analyse discussions for companies where discover_discussions completed more recently"
    concurrency_limit: 1
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules:
      - cron: "7,27,47 * * * *"
        timezone: "UTC"
        active: false
    parameters:
      token_budget: 250000
      label_filter:
        - investor
        - cro
        - pharma
        - clinic

  - name: ai-propose-actions
    entrypoint: email_manager.scheduler.flows:propose_actions_flow
    description: "Propose actions for companies where analyse_discussions completed more recently"
    concurrency_limit: 1
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules:
      - cron: "12,32,52 * * * *"
        timezone: "UTC"
        active: false
    parameters:
      token_budget: 250000
      label_filter:
        - investor
        - cro
        - pharma
        - clinic

  - name: ai-contact-memory
    entrypoint: email_manager.scheduler.flows:contact_memory_flow
    description: "Build contact memories for companies where propose_actions completed more recently"
    concurrency_limit: 1
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules:
      - cron: "17 */2 * * *"
        timezone: "UTC"
        active: false
    parameters:
      token_budget: 150000
      label_filter:
        - investor
        - cro
        - pharma
        - clinic

  # ── AI analysis (legacy): full pipeline in one flow — manual trigger only ────
  - name: ai-analysis
    entrypoint: email_manager.scheduler.flows:ai_flow
    description: "Run all AI stages in one flow (manual backfill / one-shot refresh only)"
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules: []   # No schedule — trigger manually for backfills
    parameters:
      event_budget: 100
      solo_threshold: 50
      random_sample: true
      label_filter:
        - investor
        - cro
        - pharma
        - clinic

  # ── Single company: on-demand targeted AI run ────────────────────────────────
  - name: company-ai
    entrypoint: email_manager.scheduler.flows:company_flow
    description: "Run AI pipeline stages for a single company (triggered from the web UI)"
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules: []   # No schedule — triggered on demand
    parameters:
      domain: ""
      stages: null
      force: false

  # ── Maintenance: crash zombie RUNNING flows ──────────────────────────────────
  - name: maintenance
    entrypoint: email_manager.scheduler.flows:maintenance_flow
    description: "Crash zombie RUNNING flows that have exceeded max_age_seconds (default 7h)"
    concurrency_limit: 1
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules:
      - cron: "*/30 * * * *"
        timezone: "UTC"
        active: false
    parameters:
      max_age_seconds: 25200

  # ── Full run: one-shot bootstrap / manual refresh ───────────────────────────
  - name: full-run
    entrypoint: email_manager.scheduler.flows:full_run_flow
    description: "Ingest → Enrich → AI in sequence (manual trigger only)"
    work_pool:
      name: default-process
      job_variables:
        env:
          PYTHONPATH: /tmp/em-deps:/opt/em-deps:/tmp/em-venv/lib/python3.11/site-packages
          HTTPS_PROXY: "http://127.0.0.1:8080"
          HTTP_PROXY: "http://127.0.0.1:8080"
          NO_PROXY: "localhost,127.0.0.1,prefect-server,postgres.svc"
          AI_BACKEND: "codex"
          CODEX_MODEL: "gpt-5.4-mini"
          EXTRACT_EVENTS_MODEL: "gpt-5.5"
          CODEX_HOME: "/tmp/codex-home"
          CODEX_HTTP_RELAY: "http://172.21.1.38:8091"
          PATH: "/usr/local/bin:/usr/bin:/bin"
    schedules: []   # No schedule — trigger manually
