name: Publish worker image

on:
  push:
    branches: [main]
    paths:
      - "email-analyser/src/**"
      - "email-analyser/pyproject.toml"
      - "email-analyser/prefect.yaml"
      - "email-analyser/Dockerfile.worker"
      - "email-analyser/scripts/worker-entrypoint.sh"

env:
  IMAGE: ghcr.io/blaisethom/email-manager/worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: email-analyser
          file: email-analyser/Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
